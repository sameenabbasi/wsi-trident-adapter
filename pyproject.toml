[project]
name = "wsi-pipeline"
version = "0.0.1"

requires-python = "^3.10"

dependencies = [
    "h5py",
    "ipywidgets",
    "tqdm",

    "einops_exts",

    "torch",
    "segmentation-models-pytorch",

    "huggingface_hub",
    "timm == 0.9.16",
    "transformers",

    "geopandas",
    "matplotlib",
    "Pillow",
    "scipy",
    "opencv-python",

    "openslide-bin",
    "openslide-python",
]


[project.optional-dependencies]
musk = [
    "fairscale",
    "musk @ git+https://github.com/lilab-stanford/MUSK",
]

conch = [
    "conch @ git+https://github.com/Mahmoodlab/CONCH.git",
]

ctranspath = [
    "timm_ctp",
]

prism = [
    "environs==11.0.0",
    "sacremoses==0.1.1",
]

chief = [
    "addict",
]

gigapath = [
    "fairscale",
    "gigapath @ git+https://github.com/prov-gigapath/prov-gigapath.git",
    "flash_attn==2.5.8"
]

madeleine = [
    "madeleine @ git+https://github.com/mahmoodlab/MADELEINE.git",
]

patch_encoders = ["wsi-pipeline[musk,conch,ctranspath]"]

slide_encoders = ["wsi-pipeline[prism,chief,gigapath,madeleine]"]

all = ["wsi-pipeline[patch_encoders,slide_encoders]"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 80
unstable = true

[tool.setuptools.packages.find]
include = ["wsi-pipeline", "wsi-pipeline.*"]