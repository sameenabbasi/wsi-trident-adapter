io:
    wsi_dir: example/slides
    wsi_extension:
        - .svs
        - .tif
    job_dir: example/out
    custom_list_of_wsis: null

segmentation:
    segmenter: hest
    seg_conf_thresh: 0.4
    remove_artifacts: false
    remove_holes: false

patching:
    magnification: 20
    patch_size: 256
    overlap: 0
    min_tissue_proportion: 0

features:
    encoder: uni_v2
    batch_size: 64

system:
    device: cuda
